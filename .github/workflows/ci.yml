name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install dependencies
        run: go mod tidy

      - name: Build server
        run: go build -v ./cmd/server

      - name: Build client
        run: go build -v ./cmd/client

      - name: Run tests (with race detector)
        run: go test ./... -v -race -timeout 60s

      - name: Vet
        run: go vet ./...
